# This is a basic workflow to help you get started with Actions

name: Dev Build CI

on:
  pull_request:
    branches: ["main", "dev"]
  push:
    branches: ["dev"]

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:

  # This workflow contains a single job called "build"
  build-and-release-android:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          flutter-version:  3.16.8 
          channel: stable
      - name: Decode keystore
        run: |
          echo $ENCODED_KEYSTORE | base64 -di > android/app/keystore.jks
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE }}

      - run: flutter pub get
      - name: Install Android SDK 36 properly
        run: |
          rm -rf $ANDROID_HOME/platforms/android-36 $ANDROID_HOME/platforms/android-36-ext18 $ANDROID_HOME/platforms/android-36-ext19
          echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "platforms;android-36" 2>&1
          ls -la $ANDROID_HOME/platforms/android-36/
      # 打包apk
      - name: Collect Apks
        run: flutter build apk --release --split-per-abi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD}}

      # 发布安装包
      - name: Upload Artifact - armeabi-v7a
        uses: actions/upload-artifact@v4
        with:
          path: "build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk"
          name: Miru-pr-${{ github.event.pull_request.number }}-armeabi-v7a.apk
      - name: Upload Artifact - arm64-v8a
        uses: actions/upload-artifact@v4
        with:
          path: "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          name: Miru-pr-${{ github.event.pull_request.number }}-arm64-v8a.apk
      - name: Upload Artifact - x86
        uses: actions/upload-artifact@v4
        with:
          path: "build/app/outputs/flutter-apk/app-x86_64-release.apk"
          name: Miru-pr-${{ github.event.pull_request.number }}-x86_64.apk

